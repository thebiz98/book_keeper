[package]
name = "book-keeper"
version = "0.1.0"
description = "Offline-first desktop retail accounting and inventory management application"
authors = ["Book Keeper"]
edition = "2021"

[lib]
name = "book_keeper"
path = "src/lib.rs"

[[bin]]
name = "book-keeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full", "hooks", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio = { version = "1.37", features = ["full"] }
zip = "0.6"
csv = "1.3"
calamine = "0.24"
rust_xlsxwriter = "0.64"
